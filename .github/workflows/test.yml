name: Main

on:
  pull_request:
    branches: [ main ]

env:
  GH_USERNAME: ${{ github.actor }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.swift'
              - '**/*.def'
              - '**/gradle.properties'
              - 'gradle/**'

  api-check:
    name: API Compatibility
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check binary API compatibility
        run: ./gradlew apiCheck

  detekt:
    name: Detekt
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detektAll

  test-jvm:
    name: Tests (JVM)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: >
          ./gradlew
          :wiretap-core:jvmTest
          :wiretap-ktor:jvmTest
          :wiretap-ktor-noop:jvmTest
          :wiretap-okhttp:jvmTest
          :wiretap-okhttp-noop:jvmTest

  test-ios:
    name: Tests (iOS Simulator)
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: >
          ./gradlew
          :wiretap-core:iosSimulatorArm64Test
          :wiretap-ktor:iosSimulatorArm64Test
          :wiretap-ktor-noop:iosSimulatorArm64Test
          :wiretap-urlsession:iosSimulatorArm64Test
